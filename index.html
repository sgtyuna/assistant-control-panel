<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Assistant Control Panel</title>
  <meta name="description" content="One place to see what each AI assistant did, cap what it can spend, and switch it off.">
  <meta name="theme-color" content="#0e1621">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Control Panel">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- The shell. It ships empty: no assistant, limit, rule or name is written here. -->
  <div id="chooser"></div>

  <div id="shell" hidden>
    <div class="top">
    <div id="demo-strip" class="demo-strip" hidden>
      <span><b>DEMO MODE</b> · Sample data, not your record</span>
      <button data-action="toggle-demo">Turn off</button>
    </div>
    <header class="topbar">
      <div class="brand">Assistant Control Panel</div>
      <button id="pause-all" class="pause-all" data-inert aria-label="Pause Everything"></button>
    </header>
    </div>
    <div id="notice" class="notice" role="alert" hidden></div>
    <div class="body">
      <nav id="nav" class="nav" aria-label="Screens"></nav>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript>This app needs JavaScript turned on.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
